{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Page Not Found" %}{% endblock %}

{% block content %}

<div class="container-narrow" style="max-width: 500px; margin: 80px auto; text-align: center;">

    <div style="font-size: 64px; margin-bottom: var(--sp-4);">🔍</div>

    <h1>{% trans "Page Not Found" %}</h1>

    <p class="text-muted" style="margin: var(--sp-6) 0;">
        {% trans "The page you're looking for doesn't exist or has moved." %}
    </p>

    <a href="{% url 'home' %}" class="btn btn-lg">
        🏠 {% trans "Back Home" %}
    </a>

</div>

{% endblock %}
