{% load i18n %}
<div class="notif-wrapper" style="position: relative;">
    <button type="button" class="notif-bell" onclick="toggleNotifDropdown(event)"
            title="{% trans 'Notifications' %}">
        🔔
        <span id="notif-count" class="notif-badge" style="display: none;">0</span>
        <span id="notif-pulse" class="notif-pulse" style="display: none;"></span>
    </button>

    <div id="notif-dropdown" class="notif-dropdown" style="display: none;">
        <div class="notif-header">
            <strong>{% trans "Notifications" %}</strong>
            <a href="#" onclick="markAllRead(event)" style="font-size: 12px;">
                {% trans "Mark all read" %}
            </a>
        </div>
        <div id="notif-list" class="notif-list">
            <div style="padding: 20px; text-align: center; color: #94a3b8; font-size: 13px;">
                {% trans "Loading…" %}
            </div>
        </div>
        <div class="notif-footer">
            <a href="{% url 'notifications:list' %}">{% trans "View all" %} →</a>
        </div>
    </div>
</div>

<style>
.notif-bell {
    background: transparent;
    border: none;
    font-size: 20px;
    cursor: pointer;
    position: relative;
    padding: 6px;
    border-radius: 6px;
}
.notif-bell:hover { background: #f1f5f9; }
.notif-badge {
    position: absolute;
    top: 0;
    right: 0;
    background: #dc2626;
    color: white;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 5px;
    border-radius: 999px;
    min-width: 16px;
    text-align: center;
}
.notif-pulse {
    position: absolute;
    top: 0;
    right: 0;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #dc2626;
    opacity: 0.5;
    animation: notif-pulse-anim 1.5s ease-out;
    pointer-events: none;
}
@keyframes notif-pulse-anim {
    0%   { transform: scale(0.5); opacity: 0.8; }
    100% { transform: scale(2.5); opacity: 0; }
}
.notif-dropdown {
    position: absolute;
    right: 0;
    top: 44px;
    width: 360px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    z-index: 1000;
    max-height: 500px;
    display: flex;
    flex-direction: column;
}
.notif-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
}
.notif-list {
    overflow-y: auto;
    max-height: 360px;
}
.notif-item {
    padding: 12px 16px;
    border-bottom: 1px solid #f1f5f9;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: block;
}
.notif-item:hover { background: #f8fafc; }
.notif-item.unread { background: #eff6ff; }
.notif-item .notif-title {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
}
.notif-item .notif-body {
    font-size: 12px;
    color: #64748b;
    line-height: 1.4;
}
.notif-item .notif-time {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 4px;
}
.notif-footer {
    padding: 10px 16px;
    text-align: center;
    border-top: 1px solid var(--border);
    font-size: 13px;
}
</style>

<script>
let notifDropdownOpen = false;
let notifWs = null;

function toggleNotifDropdown(event) {
    event.stopPropagation();
    const dd = document.getElementById('notif-dropdown');
    notifDropdownOpen = !notifDropdownOpen;
    dd.style.display = notifDropdownOpen ? 'flex' : 'none';
    if (notifDropdownOpen) loadNotifications();
}

function loadNotifications() {
    fetch('{% url "notifications:recent_json" %}', {
        headers: {'X-Requested-With': 'XMLHttpRequest'}
    })
    .then(r => r.json())
    .then(data => {
        renderNotifList(data.notifications);
        updateCount(data.unread_count, false);
    });
}

function renderNotifList(notifications) {
    const list = document.getElementById('notif-list');
    if (!notifications || !notifications.length) {
        list.innerHTML = '<div style="padding: 20px; text-align: center; color: #94a3b8; font-size: 13px;">{% trans "No notifications yet." %}</div>';
        return;
    }
    list.innerHTML = notifications.map(n => `
        <a href="${n.link_url || '#'}" class="notif-item ${n.is_read ? '' : 'unread'}"
           onclick="markRead(${n.id}, event)">
            <div class="notif-title">${escapeHtml(n.icon)} ${escapeHtml(n.title)}</div>
            <div class="notif-body">${escapeHtml(n.body).slice(0, 140)}</div>
            <div class="notif-time">${escapeHtml(n.time_ago)}</div>
        </a>
    `).join('');
}

function updateCount(count, pulse) {
    const badge = document.getElementById('notif-count');
    if (count > 0) {
        badge.textContent = count > 99 ? '99+' : count;
        badge.style.display = 'block';
    } else {
        badge.style.display = 'none';
    }
    if (pulse) {
        const pulseEl = document.getElementById('notif-pulse');
        pulseEl.style.display = 'block';
        pulseEl.style.animation = 'none';
        void pulseEl.offsetWidth;   // force reflow
        pulseEl.style.animation = '';
        setTimeout(() => pulseEl.style.display = 'none', 1500);
    }
}

function markRead(id, event) {
    event.stopPropagation();
    fetch(`/notifications/${id}/mark-read/`, {
        method: 'POST',
        headers: {
            'X-CSRFToken': '{{ csrf_token }}',
            'X-Requested-With': 'XMLHttpRequest',
        },
    }).then(() => loadNotifications());
}

function markAllRead(event) {
    event.preventDefault();
    fetch('{% url "notifications:mark_all_read" %}', {
        method: 'POST',
        headers: {
            'X-CSRFToken': '{{ csrf_token }}',
            'X-Requested-With': 'XMLHttpRequest',
        },
    }).then(() => loadNotifications());
}

function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
}

// ============ WebSocket setup ============
function initNotifWS() {
    if (!window.CampusWS) {
        setTimeout(initNotifWS, 100);
        return;
    }
    notifWs = new CampusWS('/ws/notifications/');

    notifWs.on('notification_push', (data) => {
        // Prepend notification to dropdown if open
        if (notifDropdownOpen) {
            const list = document.getElementById('notif-list');
            const n = data.notification;
            const html = `
                <a href="${n.link_url || '#'}" class="notif-item unread"
                   onclick="markRead(${n.id}, event)">
                    <div class="notif-title">${escapeHtml(n.icon)} ${escapeHtml(n.title)}</div>
                    <div class="notif-body">${escapeHtml(n.body).slice(0, 140)}</div>
                    <div class="notif-time">${escapeHtml(n.time_ago)}</div>
                </a>`;
            list.insertAdjacentHTML('afterbegin', html);
        }
        // Trigger pulse animation
        updateCount(-1, true);
    });

    notifWs.on('unread_count', (data) => {
        updateCount(data.count, false);
    });

    notifWs.on('open', () => console.log('[Notif] WS ready'));
    notifWs.connect();
}

document.addEventListener('DOMContentLoaded', initNotifWS);

// Close dropdown on click outside
document.addEventListener('click', (e) => {
    if (notifDropdownOpen && !e.target.closest('.notif-wrapper')) {
        document.getElementById('notif-dropdown').style.display = 'none';
        notifDropdownOpen = false;
    }
});
</script>
